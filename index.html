<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ff8fc7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Olivijos pasaulis">
  <meta name="description" content="Žaisk Klaipėdoje: namai, Teatro aikštė, Meridianas, turgus, Jūrų muziejus ir Smiltynės paplūdimys.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <title>Olivijos pasaulis</title>
</head>
<body>
  <header id="topbar"></header>
  <main id="app"></main>
  <div id="drag-layer"></div>
  <div id="toast"></div>
  <!-- Registered before the game scripts so updates still arrive even if a script fails to start. -->
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => { });
  </script>
  <script src="js/data.js"></script>
  <script src="js/character.js"></script>
  <script src="js/props.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/state.js"></script>
  <script src="js/scenes/common.js"></script>
  <script src="js/scenes/home.js"></script>
  <script src="js/scenes/oldtown.js"></script>
  <script src="js/scenes/river.js"></script>
  <script src="js/scenes/market.js"></script>
  <script src="js/scenes/museum.js"></script>
  <script src="js/scenes/beach.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
